name: Node CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports: [27017:27017]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install deps
        run: |
          cd backend
          npm ci
      - name: Run tests
        run: |
          cd backend
          npm test
