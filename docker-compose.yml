version: '3'
services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
  backend:
    build: ./backend
    env_file: backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    env_file: frontend/.env.example
    ports:
      - "5173:5173"
    depends_on:
      - backend
