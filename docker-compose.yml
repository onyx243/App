version: '3'
services:
  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    environment:
      - MONGODB_URI=mongodb://mongo:27017/printshop
      - JWT_SECRET=changeme
      - JWT_EXPIRES_IN=1h
      - BASE_URL=http://localhost:5173
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://localhost:3001/api
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  mongo-data:
